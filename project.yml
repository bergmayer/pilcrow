# XcodeGen spec — fallback if Pilcrow.xcodeproj fails to open.
#
# Install XcodeGen via Homebrew (brew install xcodegen), then:
#   rm -rf Pilcrow.xcodeproj
#   xcodegen generate
#
name: Pilcrow
options:
  bundleIdPrefix: com.palefire
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  EditorKit:
    path: Packages/EditorKit
  TreeSitterTypst:
    path: Packages/TreeSitterTypst

targets:
  Pilcrow:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
    info:
      path: App/Resources/Info.plist
    dependencies:
      - package: EditorKit
        product: FileEncoding
      - package: EditorKit
        product: LineEnding
      - package: EditorKit
        product: LineSort
      - package: EditorKit
        product: CharacterInfo
      - package: EditorKit
        product: EditorEngine
      - package: EditorKit
        product: PilcrowSyntax
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.palefire.pilcrow
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconBurgundy AppIconIndigo AppIconOchre"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        GENERATE_INFOPLIST_FILE: "NO"

  PilcrowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PilcrowTests
    dependencies:
      - target: Pilcrow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.palefire.pilcrow.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Pilcrow:
    build:
      targets:
        Pilcrow: all
        PilcrowTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PilcrowTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
